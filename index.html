<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Willekeurig Bijbel Hoofdstuk - Het Boek" />
  <title>Willekeurig Bijbel Hoofdstuk</title>
 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="manifest" href="./manifest.json">
 
  <style>
  body {
    font-family: Georgia, serif;
    background-color: #f9f8f6;
    color: #2c2c2c;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  .card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    max-width: 650px;
    width: 100%;
    box-sizing: border-box;
  }
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  h2 {
    font-family: Helvetica, Arial, sans-serif;
    color: #aa7d49;
    margin-top: 0;
    margin-bottom: 5px;
  }
  .sub {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: #777;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 1px solid #eee;
    font-family: Helvetica, Arial, sans-serif;
  }
  select {
    padding: 8px 12px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background-color: #fff;
    cursor: pointer;
  }
  .btn {
    border: none;
    background-color: #aa7d49;
    color: white;
    padding: 9px 15px;
    font-size: 14px;
    border-radius: 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    transition: background-color 0.2s ease;
  }
  .btn:hover {
    background-color: #8c6437;
  }
  .chapter-title {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 22px;
    font-weight: bold;
    color: #aa7d49;
    margin-bottom: 15px;
    text-align: center;
  }

  /* VEILIGE TEKSTCONTAINER EN BEPERKINGEN VAN EXTERNE ELEMENTEN */
  .text-content {
    line-height: 1.8;
    font-size: 17px;
    text-align: justify;
    max-height: 500px;
    overflow-y: auto;
    padding-right: 10px;
  }

  /* Verberg storende overbodige elementen uit Bible.com */
  .text-content img,
  .text-content svg,
  .text-content figure,
  .text-content audio,
  .text-content video,
  .text-content [class*="audio"],
  .text-content [class*="media"] {
    display: none !important;
  }

  /* Bepaal de grootte van versnummers en koppen */
  .text-content [class*="label"],
  .text-content [class*="verse"] {
    font-weight: bold;
    color: #aa7d49;
    font-size: 0.8em;
    margin-right: 2px;
  }

  .loading {
    text-align: center;
    color: #777;
    font-style: italic;
    padding: 40px 0;
  }
  .error {
    color: #c62828;
    text-align: center;
    padding: 20px;
    font-family: Helvetica, Arial, sans-serif;
  }
  footer {
    margin-top: auto;
    padding-top: 20px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 13px;
  }
  footer a {
    color: #aa7d49;
    text-decoration: none;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h2>Willekeurig Bijbel Hoofdstuk</h2>
      <div class="sub">Vertaling: <strong>Het Boek (HTB)</strong> via Bible.com</div>
    </div>

    <div class="controls">
      <div>
        <label for="testament-select"><strong>Bereik:</strong></label>
        <select id="testament-select" onchange="pick_chapter()">
          <option value="all">Hele Bijbel</option>
          <option value="ot">Oude Testament</option>
          <option value="nt">Nieuwe Testament</option>
        </select>
      </div>

      <button class="btn" onclick="pick_chapter()">
        <i class="fa fa-refresh"></i> Nieuw hoofdstuk
      </button>
    </div>

    <div id="chapter-title" class="chapter-title">Laden...</div>

    <div id="text-content" class="text-content">
      <div class="loading">Bijbeltekst ophalen van Bible.com...</div>
    </div>
  </div>

  <footer>
    <a href="https://github.com/micheldejoode/WillekeurigBijbelHoofdstuk" target="_blank">Over deze website</a>
  </footer>

  <script>
    // VUL HIER JOUW CLOUDFLARE WORKER URL IN
    const WORKER_URL = "https://wispy-mountain-8d89.micheldejoode.workers.dev/";

    const bible_books = [
      {book: "Genesis", chapters: 50, abbr: "gen", testament: "ot"},
      {book: "Exodus", chapters: 40, abbr: "exo", testament: "ot"},
      {book: "Leviticus", chapters: 27, abbr: "lev", testament: "ot"},
      {book: "Numeri", chapters: 36, abbr: "num", testament: "ot"},
      {book: "Deuteronomium", chapters: 34, abbr: "deu", testament: "ot"},
      {book: "Jozua", chapters: 24, abbr: "jos", testament: "ot"},
      {book: "Rechters", chapters: 21, abbr: "jdg", testament: "ot"},
      {book: "Rut", chapters: 4, abbr: "rut", testament: "ot"},
      {book: "1 Samuel", chapters: 31, abbr: "1sa", testament: "ot"},
      {book: "2 Samuel", chapters: 24, abbr: "2sa", testament: "ot"},
      {book: "1 Koningen", chapters: 22, abbr: "1ki", testament: "ot"},
      {book: "2 Koningen", chapters: 25, abbr: "2ki", testament: "ot"},
      {book: "1 Kronieken", chapters: 29, abbr: "1ch", testament: "ot"},
      {book: "2 Kronieken", chapters: 36, abbr: "2ch", testament: "ot"},
      {book: "Ezra", chapters: 10, abbr: "ezr", testament: "ot"},
      {book: "Nehemia", chapters: 13, abbr: "neh", testament: "ot"},
      {book: "Ester", chapters: 10, abbr: "est", testament: "ot"},
      {book: "Job", chapters: 42, abbr: "job", testament: "ot"},
      {book: "Psalmen", chapters: 150, abbr: "psa", testament: "ot"},
      {book: "Spreuken", chapters: 31, abbr: "pro", testament: "ot"},
      {book: "Prediker", chapters: 12, abbr: "ecc", testament: "ot"},
      {book: "Hooglied", chapters: 8, abbr: "sng", testament: "ot"},
      {book: "Jesaja", chapters: 66, abbr: "isa", testament: "ot"},
      {book: "Jeremia", chapters: 52, abbr: "jer", testament: "ot"},
      {book: "Klaagliederen", chapters: 5, abbr: "lam", testament: "ot"},
      {book: "Ezechiël", chapters: 48, abbr: "ezk", testament: "ot"},
      {book: "Daniël", chapters: 12, abbr: "dan", testament: "ot"},
      {book: "Hosea", chapters: 14, abbr: "hos", testament: "ot"},
      {book: "Joël", chapters: 3, abbr: "jol", testament: "ot"},
      {book: "Amos", chapters: 9, abbr: "amo", testament: "ot"},
      {book: "Obadja", chapters: 1, abbr: "oba", testament: "ot"},
      {book: "Jona", chapters: 4, abbr: "jon", testament: "ot"},
      {book: "Micha", chapters: 7, abbr: "mic", testament: "ot"},
      {book: "Nahum", chapters: 3, abbr: "nam", testament: "ot"},
      {book: "Habakuk", chapters: 3, abbr: "hab", testament: "ot"},
      {book: "Sefanja", chapters: 3, abbr: "zep", testament: "ot"},
      {book: "Haggai", chapters: 2, abbr: "hag", testament: "ot"},
      {book: "Zacharia", chapters: 14, abbr: "zec", testament: "ot"},
      {book: "Maleachi", chapters: 4, abbr: "mal", testament: "ot"},
      {book: "Mattheüs", chapters: 28, abbr: "mat", testament: "nt"},
      {book: "Markus", chapters: 16, abbr: "mrk", testament: "nt"},
      {book: "Lukas", chapters: 24, abbr: "luk", testament: "nt"},
      {book: "Johannes", chapters: 21, abbr: "jhn", testament: "nt"},
      {book: "Handelingen", chapters: 28, abbr: "act", testament: "nt"},
      {book: "Romeinen", chapters: 16, abbr: "rom", testament: "nt"},
      {book: "1 Korintiërs", chapters: 16, abbr: "1co", testament: "nt"},
      {book: "2 Korintiërs", chapters: 13, abbr: "2co", testament: "nt"},
      {book: "Galaten", chapters: 6, abbr: "gal", testament: "nt"},
      {book: "Efeziërs", chapters: 6, abbr: "eph", testament: "nt"},
      {book: "Filippenzen", chapters: 4, abbr: "php", testament: "nt"},
      {book: "Kolossenzen", chapters: 4, abbr: "col", testament: "nt"},
      {book: "1 Tessalonicenzen", chapters: 5, abbr: "1th", testament: "nt"},
      {book: "2 Tessalonicenzen", chapters: 3, abbr: "2th", testament: "nt"},
      {book: "1 Timotheüs", chapters: 6, abbr: "1ti", testament: "nt"},
      {book: "2 Timotheüs", chapters: 4, abbr: "2ti", testament: "nt"},
      {book: "Titus", chapters: 3, abbr: "tit", testament: "nt"},
      {book: "Filemon", chapters: 1, abbr: "phm", testament: "nt"},
      {book: "Hebreeën", chapters: 13, abbr: "heb", testament: "nt"},
      {book: "Jakobus", chapters: 5, abbr: "jas", testament: "nt"},
      {book: "1 Petrus", chapters: 5, abbr: "1pe", testament: "nt"},
      {book: "2 Petrus", chapters: 3, abbr: "2pe", testament: "nt"},
      {book: "1 Johannes", chapters: 5, abbr: "1jn", testament: "nt"},
      {book: "2 Johannes", chapters: 1, abbr: "2jn", testament: "nt"},
      {book: "3 Johannes", chapters: 1, abbr: "3jn", testament: "nt"},
      {book: "Judas", chapters: 1, abbr: "jud", testament: "nt"},
      {book: "Openbaring", chapters: 22, abbr: "rev", testament: "nt"}
    ];

    function build_index() {
      let list = [];
      bible_books.forEach(b => {
        for (let c = 1; c <= b.chapters; c++) {
          list.push({
            bookName: b.book,
            abbr: b.abbr,
            chapter: c,
            testament: b.testament
          });
        }
      });
      return list;
    }

    const allChapters = build_index();

    async function pick_chapter() {
  const filter = document.getElementById('testament-select').value;
  const titleEl = document.getElementById('chapter-title');
  const textEl = document.getElementById('text-content');

  let pool = allChapters;
  if (filter !== 'all') {
    pool = allChapters.filter(ch => ch.testament === filter);
  }

  const selected = pool[Math.floor(Math.random() * pool.length)];
  titleEl.innerText = `${selected.bookName} ${selected.chapter}`;
  textEl.innerHTML = `<div class="loading"><i class="fa fa-spinner fa-spin"></i> Tekst inladen uit Het Boek...</div>`;

  const bibleUrl = `https://www.bible.com/nl/bible/75/${selected.abbr}.${selected.chapter}.HTB`;
  const proxyFetchUrl = `${WORKER_URL}?url=${encodeURIComponent(bibleUrl)}`;

  try {
    const response = await fetch(proxyFetchUrl);
    if (!response.ok) throw new Error("Proxy fout");

    const htmlText = await response.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(htmlText, 'text/html');

    const nextDataScript = doc.querySelector('script[id="__NEXT_DATA__"]');
    let rawHtml = '';

    if (nextDataScript) {
      const jsonData = JSON.parse(nextDataScript.textContent);
      const pageProps = jsonData?.props?.pageProps;
      rawHtml = pageProps?.chapterData?.content || pageProps?.content || '';
    }

    if (!rawHtml) {
      const chapterContainer = doc.querySelector('div[class*="ChapterContent_chapter"]') || 
                               doc.querySelector('.chapter');
      if (chapterContainer) rawHtml = chapterContainer.innerHTML;
    }

    if (rawHtml) {
      // MAAK EEN TIJDELIJK ELEMENT OM ONGEWENSTE INHOUD SCHOON TE MAKEN
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = rawHtml;

      // Verwijder afbeeldingen, SVG-iconen, audiospelers en scripts
      tempDiv.querySelectorAll('img, svg, figure, audio, video, script, style').forEach(el => el.remove());

      textEl.innerHTML = tempDiv.innerHTML;
      textEl.scrollTop = 0;
    } else {
      textEl.innerHTML = `<div class="error">Kon de tekst niet uit de pagina lezen.<br><a href="${bibleUrl}" target="_blank" style="color:#aa7d49;">Open direct op Bible.com</a></div>`;
    }

  } catch (err) {
    textEl.innerHTML = `<div class="error">Fout bij laden van tekst via de worker. Controleer of de WORKER_URL klopt.</div>`;
  }
}

    pick_chapter();
  </script>
</body>
</html>
