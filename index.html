<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Willekeurig Bijbel Hoofdstuk" />
  <title>Willekeurig Bijbel Hoofdstuk</title>
 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="manifest" href="./manifest.json">
 
  <style>
    body {
      font-family: Georgia, serif;
      background-color: #f9f8f6;
      color: #2c2c2c;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      max-width: 650px;
      width: 100%;
      box-sizing: border-box;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    h2 {
      font-family: Helvetica, Arial, sans-serif;
      color: #aa7d49;
      margin-top: 0;
      margin-bottom: 5px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
      font-family: Helvetica, Arial, sans-serif;
    }
    .select-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    select {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: #fff;
      cursor: pointer;
    }
    .btn {
      border: none;
      background-color: #aa7d49;
      color: white;
      padding: 9px 15px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #8c6437;
    }
    .btn-outline {
      background-color: transparent;
      color: #aa7d49;
      border: 1px solid #aa7d49;
    }
    .btn-outline:hover {
      background-color: #fdfaf6;
    }
    .chapter-title {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 22px;
      font-weight: bold;
      color: #aa7d49;
      margin-bottom: 15px;
      text-align: center;
    }
    .text-content {
      line-height: 1.8;
      font-size: 17px;
      text-align: justify;
      max-height: 500px;
      overflow-y: auto;
      padding-right: 10px;
    }
    .verse-num {
      font-size: 11px;
      font-weight: bold;
      color: #aa7d49;
      vertical-align: super;
      margin-right: 3px;
    }
    .loading {
      text-align: center;
      color: #777;
      font-style: italic;
      padding: 40px 0;
    }
    .action-bar {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: center;
      gap: 10px;
      font-family: Helvetica, Arial, sans-serif;
    }
    footer {
      margin-top: auto;
      padding-top: 20px;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 13px;
    }
    footer a {
      color: #aa7d49;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h2>Willekeurig Bijbel Hoofdstuk</h2>
    </div>

    <div class="controls">
      <div class="select-group">
        <select id="testament-select" onchange="pick_chapter()">
          <option value="all">Hele Bijbel</option>
          <option value="ot">Oude Testament</option>
          <option value="nt">Nieuwe Testament</option>
        </select>
      </div>

      <button class="btn" onclick="pick_chapter()">
        <i class="fa fa-refresh"></i> Nieuw hoofdstuk
      </button>
    </div>

    <div id="chapter-title" class="chapter-title">Laden...</div>

    <div id="text-content" class="text-content">
      <div class="loading">Bijbeltekst laden...</div>
    </div>

    <div class="action-bar">
      <a id="bible-com-link" class="btn btn-outline" href="#" target="_blank">
        <i class="fa fa-external-link"></i> Open 'Het Boek' op Bible.com
      </a>
    </div>
  </div>

  <footer>
    <a href="https://github.com/micheldejoode/WillekeurigBijbelHoofdstuk" target="_blank">Over deze website</a>
  </footer>

  <script>
    const bible_books = [
      {book: "Genesis", chapters: 50, id: 1, abbr: "gen", testament: "ot"},
      {book: "Exodus", chapters: 40, id: 2, abbr: "exo", testament: "ot"},
      {book: "Leviticus", chapters: 27, id: 3, abbr: "lev", testament: "ot"},
      {book: "Numeri", chapters: 36, id: 4, abbr: "num", testament: "ot"},
      {book: "Deuteronomium", chapters: 34, id: 5, abbr: "deu", testament: "ot"},
      {book: "Jozua", chapters: 24, id: 6, abbr: "jos", testament: "ot"},
      {book: "Rechters", chapters: 21, id: 7, abbr: "jdg", testament: "ot"},
      {book: "Rut", chapters: 4, id: 8, abbr: "rut", testament: "ot"},
      {book: "1 Samuel", chapters: 31, id: 9, abbr: "1sa", testament: "ot"},
      {book: "2 Samuel", chapters: 24, id: 10, abbr: "2sa", testament: "ot"},
      {book: "1 Koningen", chapters: 22, id: 11, abbr: "1ki", testament: "ot"},
      {book: "2 Koningen", chapters: 25, id: 12, abbr: "2ki", testament: "ot"},
      {book: "1 Kronieken", chapters: 29, id: 13, abbr: "1ch", testament: "ot"},
      {book: "2 Kronieken", chapters: 36, id: 14, abbr: "2ch", testament: "ot"},
      {book: "Ezra", chapters: 10, id: 15, abbr: "ezr", testament: "ot"},
      {book: "Nehemia", chapters: 13, id: 16, abbr: "neh", testament: "ot"},
      {book: "Ester", chapters: 10, id: 17, abbr: "est", testament: "ot"},
      {book: "Job", chapters: 42, id: 18, abbr: "job", testament: "ot"},
      {book: "Psalmen", chapters: 150, id: 19, abbr: "psa", testament: "ot"},
      {book: "Spreuken", chapters: 31, id: 20, abbr: "pro", testament: "ot"},
      {book: "Prediker", chapters: 12, id: 21, abbr: "ecc", testament: "ot"},
      {book: "Hooglied", chapters: 8, id: 22, abbr: "sng", testament: "ot"},
      {book: "Jesaja", chapters: 66, id: 23, abbr: "isa", testament: "ot"},
      {book: "Jeremia", chapters: 52, id: 24, abbr: "jer", testament: "ot"},
      {book: "Klaagliederen", chapters: 5, id: 25, abbr: "lam", testament: "ot"},
      {book: "Ezechiël", chapters: 48, id: 26, abbr: "ezk", testament: "ot"},
      {book: "Daniël", chapters: 12, id: 27, abbr: "dan", testament: "ot"},
      {book: "Hosea", chapters: 14, id: 28, abbr: "hos", testament: "ot"},
      {book: "Joël", chapters: 3, id: 29, abbr: "jol", testament: "ot"},
      {book: "Amos", chapters: 9, id: 30, abbr: "amo", testament: "ot"},
      {book: "Obadja", chapters: 1, id: 31, abbr: "oba", testament: "ot"},
      {book: "Jona", chapters: 4, id: 32, abbr: "jon", testament: "ot"},
      {book: "Micha", chapters: 7, id: 33, abbr: "mic", testament: "ot"},
      {book: "Nahum", chapters: 3, id: 34, abbr: "nam", testament: "ot"},
      {book: "Habakuk", chapters: 3, id: 35, abbr: "hab", testament: "ot"},
      {book: "Sefanja", chapters: 3, id: 36, abbr: "zep", testament: "ot"},
      {book: "Haggai", chapters: 2, id: 37, abbr: "hag", testament: "ot"},
      {book: "Zacharia", chapters: 14, id: 38, abbr: "zec", testament: "ot"},
      {book: "Maleachi", chapters: 4, id: 39, abbr: "mal", testament: "ot"},
      {book: "Mattheüs", chapters: 28, id: 40, abbr: "mat", testament: "nt"},
      {book: "Markus", chapters: 16, id: 41, abbr: "mrk", testament: "nt"},
      {book: "Lukas", chapters: 24, id: 42, abbr: "luk", testament: "nt"},
      {book: "Johannes", chapters: 21, id: 43, abbr: "jhn", testament: "nt"},
      {book: "Handelingen", chapters: 28, id: 44, abbr: "act", testament: "nt"},
      {book: "Romeinen", chapters: 16, id: 45, abbr: "rom", testament: "nt"},
      {book: "1 Korintiërs", chapters: 16, id: 46, abbr: "1co", testament: "nt"},
      {book: "2 Korintiërs", chapters: 13, id: 47, abbr: "2co", testament: "nt"},
      {book: "Galaten", chapters: 6, id: 48, abbr: "gal", testament: "nt"},
      {book: "Efeziërs", chapters: 6, id: 49, abbr: "eph", testament: "nt"},
      {book: "Filippenzen", chapters: 4, id: 50, abbr: "php", testament: "nt"},
      {book: "Kolossenzen", chapters: 4, id: 51, abbr: "col", testament: "nt"},
      {book: "1 Tessalonicenzen", chapters: 5, id: 52, abbr: "1th", testament: "nt"},
      {book: "2 Tessalonicenzen", chapters: 3, id: 53, abbr: "2th", testament: "nt"},
      {book: "1 Timotheüs", chapters: 6, id: 54, abbr: "1ti", testament: "nt"},
      {book: "2 Timotheüs", chapters: 4, id: 55, abbr: "2ti", testament: "nt"},
      {book: "Titus", chapters: 3, id: 56, abbr: "tit", testament: "nt"},
      {book: "Filemon", chapters: 1, id: 57, abbr: "phm", testament: "nt"},
      {book: "Hebreeën", chapters: 13, id: 58, abbr: "heb", testament: "nt"},
      {book: "Jakobus", chapters: 5, id: 59, abbr: "jas", testament: "nt"},
      {book: "1 Petrus", chapters: 5, id: 60, abbr: "1pe", testament: "nt"},
      {book: "2 Petrus", chapters: 3, id: 61, testament: "nt"},
      {book: "1 Johannes", chapters: 5, id: 62, testament: "nt"},
      {book: "2 Johannes", chapters: 1, id: 63, testament: "nt"},
      {book: "3 Johannes", chapters: 1, id: 64, testament: "nt"},
      {book: "Judas", chapters: 1, id: 65, testament: "nt"},
      {book: "Openbaring", chapters: 22, id: 66, testament: "nt"}
    ];

    function build_index() {
      let list = [];
      bible_books.forEach(b => {
        for (let c = 1; c <= b.chapters; c++) {
          list.push({
            bookName: b.book,
            bookId: b.id,
            abbr: b.abbr,
            chapter: c,
            testament: b.testament
          });
        }
      });
      return list;
    }

    const allChapters = build_index();

    async function pick_chapter() {
      const filter = document.getElementById('testament-select').value;
      const titleEl = document.getElementById('chapter-title');
      const textEl = document.getElementById('text-content');
      const bibleLink = document.getElementById('bible-com-link');

      let pool = allChapters;
      if (filter !== 'all') {
        pool = allChapters.filter(ch => ch.testament === filter);
      }

      const selected = pool[Math.floor(Math.random() * pool.length)];

      titleEl.innerText = `${selected.bookName} ${selected.chapter}`;
      textEl.innerHTML = `<div class="loading"><i class="fa fa-spinner fa-spin"></i> Tekst laden...</div>`;

      // Bible.com Link instellen voor "Het Boek" (ID 75 op Bible.com)
      const htbUrl = `https://www.bible.com/nl/bible/75/${selected.abbr}.${selected.chapter}.HTB`;
      bibleLink.href = htbUrl;

      try {
        // Directe, betrouwbare API-aanroep zonder CORS-problemen
        const response = await fetch(`https://bolls.life/get-chapter/BB/${selected.bookId}/${selected.chapter}/`);
        if (!response.ok) throw new Error("Netwerkfout");

        const verses = await response.json();
        let html = '';
        verses.forEach(v => {
          html += `<span class="verse-num">${v.verse}</span>${v.text} `;
        });

        textEl.innerHTML = html;
        textEl.scrollTop = 0;

      } catch (err) {
        textEl.innerHTML = `<div class="loading">Kon de tekst niet direct inladen. Klik op de knop hieronder om het hoofdstuk te lezen op Bible.com.</div>`;
      }
    }

    pick_chapter();
  </script>
</body>
</html>
