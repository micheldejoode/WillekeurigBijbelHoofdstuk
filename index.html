<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Willekeurig Bijbel Hoofdstuk - Ontdek de Bijbel op een nieuwe manier met vertalingen zoals Het Boek (HTB), HSV, NBG51 en BGT." />
  <title>Willekeurig Bijbel Hoofdstuk</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Google Fonts for reading typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fbf8f3',
              100: '#f5edd8',
              200: '#ebd9b0',
              500: '#aa7d49',
              600: '#946636',
              700: '#7a502a',
              900: '#422811',
            }
          },
          fontFamily: {
            serif: ['Lora', 'Georgia', 'serif'],
            display: ['Cinzel', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Custom scrollbar for Bible reader */
    .bible-reader::-webkit-scrollbar {
      width: 6px;
    }
    .bible-reader::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.03);
      border-radius: 8px;
    }
    .bible-reader::-webkit-scrollbar-thumb {
      background: rgba(170, 125, 73, 0.3);
      border-radius: 8px;
    }
    .bible-reader::-webkit-scrollbar-thumb:hover {
      background: rgba(170, 125, 73, 0.6);
    }
    .verse-num {
      font-size: 0.72em;
      font-weight: 700;
      color: #aa7d49;
      vertical-align: super;
      margin-right: 2px;
      margin-left: 6px;
      user-select: none;
    }
    .verse-num:first-child {
      margin-left: 0;
    }
    /* YouVersion HTML scraped content formatting cleanup */
    .bible-content p {
      margin-bottom: 0.85em;
      line-height: 1.8;
    }
    .bible-content .s1, .bible-content .s {
      font-weight: 700;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #aa7d49;
      margin-top: 1.2em;
      margin-bottom: 0.4em;
      display: block;
      font-size: 1.1em;
    }
    .bible-content .q1, .bible-content .q2 {
      padding-left: 1.2rem;
      margin-bottom: 0.3rem;
    }
  </style>
</head>
<body class="bg-amber-50/40 text-stone-800 dark:bg-stone-900 dark:text-stone-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- Header -->
  <header class="w-full border-b border-amber-900/10 dark:border-stone-800 bg-white/80 dark:bg-stone-900/80 backdrop-blur-md sticky top-0 z-20">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 text-white flex items-center justify-center shadow-md shadow-brand-500/20">
          <i class="fa-solid fa-book-bible text-lg"></i>
        </div>
        <div>
          <h1 class="font-display font-bold text-lg leading-tight text-brand-900 dark:text-amber-200">
            Willekeurig Bijbel Hoofdstuk
          </h1>
          <p class="text-xs text-stone-500 dark:text-stone-400">Ontdek de Schrift op een nieuwe manier</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Theme Toggle -->
        <button id="themeToggle" onclick="toggleDarkMode()" title="Donkere/Lichte modus" class="p-2.5 rounded-lg text-stone-600 dark:text-stone-300 hover:bg-stone-100 dark:hover:bg-stone-800 transition">
          <i class="fa-solid fa-moon dark:hidden"></i>
          <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6 flex flex-col gap-5">

    <!-- Controls Bar -->
    <section class="bg-white dark:bg-stone-800/80 rounded-2xl p-4 md:p-5 shadow-sm border border-stone-200/80 dark:border-stone-700/60 flex flex-col md:flex-row gap-4 items-stretch md:items-center justify-between">
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 flex-1">
        <!-- Testament Selector -->
        <div>
          <label for="testamentSelect" class="block text-xs font-semibold text-stone-500 dark:text-stone-400 uppercase tracking-wider mb-1">
            <i class="fa-solid fa-filter text-brand-500 mr-1"></i> Bereik
          </label>
          <select id="testamentSelect" onchange="pickChapter()" class="w-full bg-stone-50 dark:bg-stone-900 border border-stone-200 dark:border-stone-700 rounded-xl px-3 py-2 text-sm font-medium text-stone-800 dark:text-stone-200 focus:ring-2 focus:ring-brand-500 focus:outline-none transition">
            <option value="all">Hele Bijbel (1189 hfdst.)</option>
            <option value="ot">Oude Testament (929 hfdst.)</option>
            <option value="nt">Nieuwe Testament (260 hfdst.)</option>
          </select>
        </div>

        <!-- Translation Selector -->
        <div>
          <label for="translationSelect" class="block text-xs font-semibold text-stone-500 dark:text-stone-400 uppercase tracking-wider mb-1">
            <i class="fa-solid fa-language text-brand-500 mr-1"></i> Vertaling (Bible.com)
          </label>
          <select id="translationSelect" onchange="loadCurrentChapterText()" class="w-full bg-stone-50 dark:bg-stone-900 border border-stone-200 dark:border-stone-700 rounded-xl px-3 py-2 text-sm font-medium text-stone-800 dark:text-stone-200 focus:ring-2 focus:ring-brand-500 focus:outline-none transition">
            <option value="75" selected>Het Boek (HTB)</option>
            <option value="199">Herziene Statenvertaling (HSV)</option>
            <option value="127">NBG-vertaling 1951 (NBG51)</option>
            <option value="172">Bijbel in Gewone Taal (BGT)</option>
            <option value="328">BasisBijbel (BB)</option>
          </select>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2 pt-2 md:pt-0 border-t md:border-t-0 border-stone-100 dark:border-stone-700">
        <button onclick="pickChapter()" class="flex-1 md:flex-initial bg-brand-500 hover:bg-brand-600 active:scale-95 text-white font-medium px-5 py-2.5 rounded-xl shadow-md shadow-brand-500/20 transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-dice text-sm"></i>
          <span>Willekeurig</span>
        </button>

        <a id="openBibleComBtn" href="#" target="_blank" title="Open op Bible.com" class="p-2.5 rounded-xl bg-stone-100 dark:bg-stone-700 hover:bg-stone-200 dark:hover:bg-stone-600 text-stone-700 dark:text-stone-200 transition flex items-center justify-center">
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
        </a>
      </div>
    </section>

    <!-- Reading Card -->
    <article class="bg-white dark:bg-stone-800/90 rounded-2xl p-6 md:p-8 shadow-sm border border-stone-200/80 dark:border-stone-700/60 flex-1 flex flex-col min-h-[450px]">
      
      <!-- Chapter Heading -->
      <header class="border-b border-stone-100 dark:border-stone-700/60 pb-4 mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div>
          <span id="testamentBadge" class="inline-block text-[11px] font-bold tracking-wider uppercase bg-amber-100 dark:bg-amber-950/60 text-brand-700 dark:text-amber-300 px-2.5 py-0.5 rounded-full mb-1">
            -
          </span>
          <h2 id="chapterTitle" class="text-2xl md:text-3xl font-display font-bold text-stone-900 dark:text-amber-100">
            Laden...
          </h2>
        </div>

        <div class="flex items-center gap-3 text-xs text-stone-500 dark:text-stone-400">
          <span id="translationBadge" class="bg-stone-100 dark:bg-stone-700 px-2.5 py-1 rounded-md font-medium">
            Het Boek
          </span>
          <button onclick="copyChapterText()" title="Kopieer tekst" class="hover:text-brand-500 transition flex items-center gap-1">
            <i class="fa-regular fa-copy"></i>
            <span id="copyStatus">Kopieer</span>
          </button>
        </div>
      </header>

      <!-- Chapter Content -->
      <div id="bibleTextContainer" class="bible-reader bible-content font-serif text-lg md:text-xl text-stone-800 dark:text-stone-200 leading-relaxed overflow-y-auto max-h-[60vh] pr-2">
        <div class="flex flex-col items-center justify-center py-16 text-stone-400 dark:text-stone-500 gap-3">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl text-brand-500"></i>
          <p class="font-sans text-sm">Bijbelhoofdstuk ophalen...</p>
        </div>
      </div>

    </article>
  </main>

  <!-- Footer -->
  <footer class="w-full border-t border-stone-200/60 dark:border-stone-800 py-4 text-center text-xs text-stone-500 dark:text-stone-400">
    <div class="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <p>Tekstafkomst via <a href="https://www.bible.com" target="_blank" class="underline hover:text-brand-500">Bible.com (YouVersion)</a></p>
      <a href="https://github.com/micheldejoode/WillekeurigBijbelHoofdstuk" target="_blank" class="hover:text-brand-500 transition flex items-center gap-1">
        <i class="fa-brands fa-github"></i> Over dit project op GitHub
      </a>
    </div>
  </footer>

  <!-- Script logic -->
  <script>
    // Complete structure of the 66 Bible books with YouVersion codes and metadata
    const BIBLE_BOOKS = [
      // Old Testament (39)
      { name: "Genesis", chapters: 50, abbr: "gen", usfm: "GEN", testament: "ot" },
      { name: "Exodus", chapters: 40, abbr: "exo", usfm: "EXO", testament: "ot" },
      { name: "Leviticus", chapters: 27, abbr: "lev", usfm: "LEV", testament: "ot" },
      { name: "Numeri", chapters: 36, abbr: "num", usfm: "NUM", testament: "ot" },
      { name: "Deuteronomium", chapters: 34, abbr: "deu", usfm: "DEU", testament: "ot" },
      { name: "Jozua", chapters: 24, abbr: "jos", usfm: "JOS", testament: "ot" },
      { name: "Rechters", chapters: 21, abbr: "jdg", usfm: "JDG", testament: "ot" },
      { name: "Rut", chapters: 4, abbr: "rut", usfm: "RUT", testament: "ot" },
      { name: "1 Samuel", chapters: 31, abbr: "1sa", usfm: "1SA", testament: "ot" },
      { name: "2 Samuel", chapters: 24, abbr: "2sa", usfm: "2SA", testament: "ot" },
      { name: "1 Koningen", chapters: 22, abbr: "1ki", usfm: "1KI", testament: "ot" },
      { name: "2 Koningen", chapters: 25, abbr: "2ki", usfm: "2KI", testament: "ot" },
      { name: "1 Kronieken", chapters: 29, abbr: "1ch", usfm: "1CH", testament: "ot" },
      { name: "2 Kronieken", chapters: 36, abbr: "2ch", usfm: "2CH", testament: "ot" },
      { name: "Ezra", chapters: 10, abbr: "ezr", usfm: "EZR", testament: "ot" },
      { name: "Nehemia", chapters: 13, abbr: "neh", usfm: "NEH", testament: "ot" },
      { name: "Ester", chapters: 10, abbr: "est", usfm: "EST", testament: "ot" },
      { name: "Job", chapters: 42, abbr: "job", usfm: "JOB", testament: "ot" },
      { name: "Psalmen", chapters: 150, abbr: "psa", usfm: "PSA", testament: "ot" },
      { name: "Spreuken", chapters: 31, abbr: "pro", usfm: "PRO", testament: "ot" },
      { name: "Prediker", chapters: 12, abbr: "ecc", usfm: "ECC", testament: "ot" },
      { name: "Hooglied", chapters: 8, abbr: "sng", usfm: "SNG", testament: "ot" },
      { name: "Jesaja", chapters: 66, abbr: "isa", usfm: "ISA", testament: "ot" },
      { name: "Jeremia", chapters: 52, abbr: "jer", usfm: "JER", testament: "ot" },
      { name: "Klaagliederen", chapters: 5, abbr: "lam", usfm: "LAM", testament: "ot" },
      { name: "Ezechiël", chapters: 48, abbr: "ezk", usfm: "EZK", testament: "ot" },
      { name: "Daniël", chapters: 12, abbr: "dan", usfm: "DAN", testament: "ot" },
      { name: "Hosea", chapters: 14, abbr: "hos", usfm: "HOS", testament: "ot" },
      { name: "Joël", chapters: 3, abbr: "jol", usfm: "JOL", testament: "ot" },
      { name: "Amos", chapters: 9, abbr: "amo", usfm: "AMO", testament: "ot" },
      { name: "Obadja", chapters: 1, abbr: "oba", usfm: "OBA", testament: "ot" },
      { name: "Jona", chapters: 4, abbr: "jon", usfm: "JON", testament: "ot" },
      { name: "Micha", chapters: 7, abbr: "mic", usfm: "MIC", testament: "ot" },
      { name: "Nahum", chapters: 3, abbr: "nam", usfm: "NAM", testament: "ot" },
      { name: "Habakuk", chapters: 3, abbr: "hab", usfm: "HAB", testament: "ot" },
      { name: "Sefanja", chapters: 3, abbr: "zep", testament: "ot" },
      { name: "Haggai", chapters: 2, abbr: "hag", usfm: "HAG", testament: "ot" },
      { name: "Zacharia", chapters: 14, abbr: "zec", usfm: "ZEC", testament: "ot" },
      { name: "Maleachi", chapters: 4, abbr: "mal", usfm: "MAL", testament: "ot" },

      // New Testament (27)
      { name: "Mattheüs", chapters: 28, abbr: "mat", usfm: "MAT", testament: "nt" },
      { name: "Markus", chapters: 16, abbr: "mrk", usfm: "MRK", testament: "nt" },
      { name: "Lukas", chapters: 24, abbr: "luk", usfm: "LUK", testament: "nt" },
      { name: "Johannes", chapters: 21, abbr: "jhn", usfm: "JHN", testament: "nt" },
      { name: "Handelingen", chapters: 28, abbr: "act", usfm: "ACT", testament: "nt" },
      { name: "Romeinen", chapters: 16, abbr: "rom", usfm: "ROM", testament: "nt" },
      { name: "1 Korintiërs", chapters: 16, abbr: "1co", usfm: "1CO", testament: "nt" },
      { name: "2 Korintiërs", chapters: 13, abbr: "2co", usfm: "2CO", testament: "nt" },
      { name: "Galaten", chapters: 6, abbr: "gal", usfm: "GAL", testament: "nt" },
      { name: "Efeziërs", chapters: 6, abbr: "eph", usfm: "EPH", testament: "nt" },
      { name: "Filippenzen", chapters: 4, abbr: "php", usfm: "PHP", testament: "nt" },
      { name: "Kolossenzen", chapters: 4, abbr: "col", usfm: "COL", testament: "nt" },
      { name: "1 Tessalonicenzen", chapters: 5, abbr: "1th", usfm: "1TH", testament: "nt" },
      { name: "2 Tessalonicenzen", chapters: 3, abbr: "2th", usfm: "2TH", testament: "nt" },
      { name: "1 Timotheüs", chapters: 6, abbr: "1ti", usfm: "1TI", testament: "nt" },
      { name: "2 Timotheüs", chapters: 4, abbr: "2ti", testament: "nt" },
      { name: "Titus", chapters: 3, abbr: "tit", usfm: "TIT", testament: "nt" },
      { name: "Filemon", chapters: 1, abbr: "phm", usfm: "PHM", testament: "nt" },
      { name: "Hebreeën", chapters: 13, abbr: "heb", usfm: "HEB", testament: "nt" },
      { name: "Jakobus", chapters: 5, abbr: "jas", usfm: "JAS", testament: "nt" },
      { name: "1 Petrus", chapters: 5, abbr: "1pe", usfm: "1PE", testament: "nt" },
      { name: "2 Petrus", chapters: 3, abbr: "2pe", usfm: "2PE", testament: "nt" },
      { name: "1 Johannes", chapters: 5, abbr: "1jn", usfm: "1JN", testament: "nt" },
      { name: "2 Johannes", chapters: 1, abbr: "2jn", usfm: "2JN", testament: "nt" },
      { name: "3 Johannes", chapters: 1, abbr: "3jn", usfm: "3JN", testament: "nt" },
      { name: "Judas", chapters: 1, abbr: "jud", usfm: "JUD", testament: "nt" },
      { name: "Openbaring", chapters: 22, abbr: "rev", usfm: "REV", testament: "nt" }
    ];

    // Build flattened indexed list of all 1189 chapters
    let allChaptersList = [];
    BIBLE_BOOKS.forEach((b, bookIndex) => {
      for (let c = 1; c <= b.chapters; c++) {
        allChaptersList.push({
          bookName: b.name,
          bookAbbr: b.abbr,
          bookUsfm: b.usfm,
          chapter: c,
          testament: b.testament,
          bookOrder: bookIndex + 1
        });
      }
    });

    // Current State
    let currentChapter = null;

    // Pick a random chapter based on active filter
    function pickChapter() {
      const filter = document.getElementById('testamentSelect').value;
      let pool = allChaptersList;

      if (filter === 'ot') {
        pool = allChaptersList.filter(ch => ch.testament === 'ot');
      } else if (filter === 'nt') {
        pool = allChaptersList.filter(ch => ch.testament === 'nt');
      }

      // Safe random selection
      const randomIndex = Math.floor(Math.random() * pool.length);
      currentChapter = pool[randomIndex];

      loadCurrentChapterText();
    }

    // Main loader for chapter content
    async function loadCurrentChapterText() {
      if (!currentChapter) return;

      const translationId = document.getElementById('translationSelect').value;
      const translationName = document.getElementById('translationSelect').options[document.getElementById('translationSelect').selectedIndex].text;

      // Update Header Info
      document.getElementById('chapterTitle').innerText = `${currentChapter.bookName} ${currentChapter.chapter}`;
      document.getElementById('testamentBadge').innerText = currentChapter.testament === 'ot' ? 'Oude Testament' : 'Nieuwe Testament';
      document.getElementById('translationBadge').innerText = translationName;

      // Direct Link to Bible.com
      const bibleComUrl = `https://www.bible.com/nl/bible/${translationId}/${currentChapter.bookAbbr}.${currentChapter.chapter}.HTB`;
      document.getElementById('openBibleComBtn').href = bibleComUrl;

      const container = document.getElementById('bibleTextContainer');
      container.innerHTML = `
        <div class="flex flex-col items-center justify-center py-16 text-stone-400 dark:text-stone-500 gap-3">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl text-brand-500"></i>
          <p class="font-sans text-sm">Ophalen via Bible.com...</p>
        </div>
      `;

      try {
        // Attempt to fetch from Bible.com HTML via CORS Proxies with fallbacks
        const targetUrl = `https://www.bible.com/nl/bible/${translationId}/${currentChapter.bookUsfm}.${currentChapter.chapter}`;
        const scrapedHtml = await fetchBibleComHtml(targetUrl);

        if (scrapedHtml) {
          const parsedContent = parseYouVersionContent(scrapedHtml);
          if (parsedContent && parsedContent.length > 50) {
            container.innerHTML = parsedContent;
            return;
          }
        }

        // Fallback to API if Bible.com html fetching was blocked
        await fetchFallbackApiText(currentChapter, container);

      } catch (err) {
        console.warn("Proxy error, using fallback API:", err);
        await fetchFallbackApiText(currentChapter, container);
      }
    }

    // CORS Proxy fetcher to pull full HTML from YouVersion / Bible.com
    async function fetchBibleComHtml(targetUrl) {
      const proxies = [
        `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
      ];

      for (const proxy of proxies) {
        try {
          const res = await fetch(proxy);
          if (res.ok) {
            if (proxy.includes('allorigins')) {
              const data = await res.json();
              return data.contents;
            } else {
              return await res.text();
            }
          }
        } catch (e) {
          console.warn("Proxy attempt failed:", proxy);
        }
      }
      return null;
    }

    // Extract main text container from scraped YouVersion web page
    function parseYouVersionContent(htmlText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, 'text/html');
      
      // Selectors used by YouVersion / Bible.com
      const chapterContainer = doc.querySelector('.ChapterContent_chapter__uvp2I') || 
                               doc.querySelector('[data-aid="chapter-content"]') || 
                               doc.querySelector('.chapter');

      if (!chapterContainer) return null;

      // Clean up unwanted elements like audio players or action icons
      chapterContainer.querySelectorAll('button, svg, .audio-player, .ChapterContent_label__').forEach(el => el.remove());

      return chapterContainer.innerHTML;
    }

    // Reliable API Fallback (Bolls Life API for Basisbijbel or HSV fallback)
    async function fetchFallbackApiText(chapterObj, container) {
      try {
        const response = await fetch(`https://bolls.life/get-chapter/BB/${chapterObj.bookOrder}/${chapterObj.chapter}/`);
        if (!response.ok) throw new Error("Fallback API error");

        const verses = await response.json();
        let html = '<div class="space-y-2">';
        verses.forEach(v => {
          // Clean html tags if present
          const cleanText = v.text.replace(/<\/?[^>]+(>|$)/g, "");
          html += `<span class="inline"><sup class="verse-num">${v.verse}</sup>${cleanText} </span>`;
        });
        html += '</div>';

        container.innerHTML = html;
      } catch (e) {
        container.innerHTML = `
          <div class="text-center py-10 px-4">
            <i class="fa-solid fa-triangle-exclamation text-amber-500 text-3xl mb-3"></i>
            <p class="font-sans text-sm text-stone-600 dark:text-stone-300">
              De tekst kon helaas niet direct geladen worden.
            </p>
            <a href="${document.getElementById('openBibleComBtn').href}" target="_blank" class="mt-4 inline-flex items-center gap-2 bg-brand-500 text-white px-4 py-2 rounded-xl text-sm font-sans font-medium">
              Open op Bible.com <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
            </a>
          </div>
        `;
      }
    }

    // Copy chapter text to clipboard
    function copyChapterText() {
      const container = document.getElementById('bibleTextContainer');
      const textToCopy = container.innerText;

      if (!textToCopy) return;

      const tempInput = document.createElement('textarea');
      tempInput.value = `${currentChapter.bookName} ${currentChapter.chapter}\n\n${textToCopy}`;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);

      const statusEl = document.getElementById('copyStatus');
      statusEl.innerText = 'Gekopieerd!';
      setTimeout(() => { statusEl.innerText = 'Kopieer'; }, 2000);
    }

    // Dark mode toggle logic
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    // Check system/local theme setting
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    // Initialize on load
    window.onload = function() {
      pickChapter();
    };
  </script>
</body>
</html>
